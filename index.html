<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3A47B8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233A47B8'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>错题通 · 错题本与薄弱点诊断</title>

<link rel="stylesheet" href="lib/katex.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- U1 图标精灵（内联 SVG，零外部依赖；24×24 网格 / 描边 1.75 / currentColor） -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5h11a2 2 0 0 1 2 2V20H7a2 2 0 0 1-2-2z"/><path d="M5 18a2 2 0 0 1 2-2h11"/></symbol>
  <symbol id="i-add" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-8"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 17l5-4 4 3 3-2 4 3"/></symbol>

  <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></symbol>

  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>

<main id="view" class="view" aria-live="polite"></main>

<nav id="tabbar" class="tabbar" aria-label="主导航"></nav>

<div id="toast" class="toast" role="status" hidden></div>

<!-- 经典脚本按依赖顺序加载：util → data → storage → stats → 各页面 → app -->
<!-- 不用 type="module"：file:// 协议下会被 CORS 拦掉，离线 zip 就打不开了 -->
<!-- KaTeX 只用于渲染公式；ECharts 在诊断页按需加载（见 ui-diag.js），避免首屏多等 1MB -->
<script src="lib/katex.min.js"></script>
<script src="js/util.js"></script>
<script src="js/mathtext.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/sample-data.js"></script>
<script src="js/stats.js"></script>
<script src="js/export-usage.js"></script>
<!-- 阶段 2：公式工具栏（数据表+纯函数 → DOM 面板）；阶段 3：拍照存图；阶段 4.1：录入埋点 -->
<script src="js/symbols.js"></script>
<script src="js/ui-toolbar.js"></script>
<script src="js/image-pipeline.js"></script>
<script src="js/image-store.js"></script>
<script src="js/image-view.js"></script>
<script src="js/photo-rotate.js"></script>
<script>window.QT_OCR_KEY = null;/* OCR 密钥注入槽：本地打包时 node build/make-dist.js --ocr-key-file <文件> 替换此 null；仓库/线上/zip 版保持 null，识别按钮自动隐藏。密钥绝不提交进 git。 */</script>
<script src="js/ocr-vault.js"></script>
<script src="js/ocr-unlock.js"></script>
<script src="js/ocr.js"></script>
<script src="js/ui-ocr.js"></script>
<script src="js/ui-entry-photo.js"></script>
<script src="js/entry-metrics.js"></script>
<script src="js/ui-home.js"></script>
<script src="js/ui-entry.js"></script>
<script src="js/ui-list.js"></script>
<script src="js/ui-diag.js"></script>
<script src="js/ui-quiz.js"></script>
<script src="js/ui-settings.js"></script>
<script src="js/ui-print.js"></script>
<script src="js/app.js"></script>

</html>
